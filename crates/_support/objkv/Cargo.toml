[package]
name = "objkv"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "objkv"
path = "src/lib.rs"

[dependencies]
pgsync = { path = "../pgsync" }
crc32c = { path = "../../port/crc32c" }
libc = "0.2"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }
rusty-s3 = { version = "0.10.2" }
